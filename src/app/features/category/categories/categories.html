<div class="categories-container">
  <div class="header-section">
    <h1>Categorias</h1>
    <p class="subtitle">Gerenciamento das categorias de produtos</p>
  </div>

  <div class="table-card mat-elevation-z2">
    <table mat-table [dataSource]="categories()" class="categories-table">

      <!-- ID Column -->
      <ng-container matColumnDef="id">
        <th mat-header-cell *matHeaderCellDef> ID </th>
        <td mat-cell *matCellDef="let category"> {{ category.id }} </td>
      </ng-container>

      <!-- Name Column -->
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef> Nome </th>
        <td mat-cell *matCellDef="let category"> {{ category.name }} </td>
      </ng-container>

      <!-- Actions Column -->
      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef class="actions-header"> Ações </th>
        <td mat-cell *matCellDef="let category" class="actions-cell">
          <button mat-icon-button color="primary" aria-label="Editar categoria" title="Editar">
            <mat-icon>edit</mat-icon>
          </button>
          <button mat-icon-button color="warn" aria-label="Remover categoria" title="Remover">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

      <!-- Row shown when there is no matching data. -->
      <tr class="mat-row" *matNoDataRow>
        <td class="mat-cell no-data-cell" colspan="3">Nenhuma categoria encontrada.</td>
      </tr>
    </table>
  </div>
</div>
